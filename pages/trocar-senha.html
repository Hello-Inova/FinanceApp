<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Trocar senha</title>
  <link rel="stylesheet" href="/static/css/login.css">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
</head>
<body>
  <div class="login-container">
    <h2>Crie uma nova senha</h2>
    <p>Por segurança, substitua a senha temporária antes de continuar.</p>
    <form id="passwordForm">
      <div class="input-group">
        <label for="senhaAtual">Senha temporária</label>
        <input id="senhaAtual" type="password" autocomplete="current-password" required>
      </div>
      <div class="input-group">
        <label for="novaSenha">Nova senha</label>
        <input id="novaSenha" type="password" minlength="8" autocomplete="new-password" required>
      </div>
      <div class="input-group">
        <label for="confirmarSenha">Confirmar nova senha</label>
        <input id="confirmarSenha" type="password" minlength="8" autocomplete="new-password" required>
      </div>
      <p>Use ao menos 8 caracteres, com maiúscula, minúscula, número e símbolo.</p>
      <p id="passwordMessage" role="alert"></p>
      <button type="submit">Salvar nova senha</button>
    </form>
  </div>
  <script src="/static/js/security.js"></script>
  <script src="/static/js/trocar-senha.js"></script>
</body>
</html>
