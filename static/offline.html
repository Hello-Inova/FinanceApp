<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>FinanceApp sem conexão</title>
  <style>
    *{box-sizing:border-box}body{display:grid;min-height:100vh;margin:0;padding:24px;place-items:center;color:#f8fafc;background:radial-gradient(circle at top,#1e293b,#020617 62%);font-family:"Segoe UI",system-ui,sans-serif}.offline-card{width:min(430px,100%);padding:32px;border:1px solid #273449;border-radius:22px;text-align:center;background:#0f172a;box-shadow:0 24px 60px rgba(0,0,0,.4)}img{width:88px;height:88px;border-radius:22px}h1{margin:20px 0 8px;font-size:1.55rem}p{margin:0 0 22px;color:#94a3b8;line-height:1.55}button{min-height:44px;padding:10px 18px;border:0;border-radius:11px;color:#fff;background:linear-gradient(135deg,#2563eb,#6366f1);font:700 .92rem inherit;cursor:pointer}
  </style>
</head>
<body><main class="offline-card"><img src="/static/img/pwa-icon-192.png" alt="Logo FinanceApp"><h1>Você está sem conexão</h1><p>Reconecte-se à internet para acessar seus dados financeiros com segurança.</p><button type="button" onclick="location.reload()">Tentar novamente</button></main></body>
</html>
